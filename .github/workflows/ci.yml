name: ci

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Self-check on the example trace
        run: |
          attest check --policy examples/policy.json --trace examples/session.jsonl || true
      - name: Self-check on the example server
        run: |
          attest test --command "python examples/servers/orders_server.py --variant secure" --policy examples/live-policy.json
      - name: Self-check on the OAuth server
        run: |
          python examples/servers/orders_http_server.py --port 8947 --oauth &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 1
          python - <<'PY'
          import json, os, subprocess, sys, time
          sys.path.insert(0, "src")
          from mcp_attest.oauth import mint_jwt

          port = 8947
          now = int(time.time())

          def token(subject, scope):
              return mint_jwt(
                  {"sub": subject, "iss": "https://auth.example.com/", "aud": "mcp://orders",
                   "scope": scope, "iat": now, "exp": now + 3600},
                  "test-signing-key",
              )

          os.environ["ALICE_TOKEN"] = token("alice", "orders:read")
          os.environ["LEAD_TOKEN"] = token("lead", "orders:read orders:write")
          os.environ["MCP_ATTEST_OAUTH_KEY"] = "test-signing-key"

          with open("examples/live-policy-oauth.json", encoding="utf-8") as handle:
              policy = json.load(handle)
          oauth = policy["oauth"]
          oauth["authorization_endpoint"] = "http://127.0.0.1:%d/authorize" % port
          oauth["redirect_uri"] = "http://127.0.0.1:%d/callback" % port
          oauth["resource"] = "http://127.0.0.1:%d/mcp" % port
          oauth["protected_resource_metadata"] = (
              "http://127.0.0.1:%d/.well-known/oauth-protected-resource" % port
          )
          oauth.pop("upstream", None)
          with open("/tmp/oauth-policy.json", "w", encoding="utf-8") as handle:
              json.dump(policy, handle)

          subprocess.run(
              [sys.executable, "-m", "mcp_attest", "test",
               "--url", "http://127.0.0.1:%d/mcp" % port,
               "--policy", "/tmp/oauth-policy.json"],
              check=True,
          )
          PY
      - name: Self-check on the suite format
        run: |
          attest suite export --policy examples/live-policy.json --out /tmp/suite.json --name self-check
          attest suite validate --suite /tmp/suite.json

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
