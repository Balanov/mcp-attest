[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-attest"
version = "1.2.0"
description = "Authorization conformance harness for MCP servers: test a live server against your own policy, as every identity, and produce evidence you can hand to an auditor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Balanov.PRO" }]
keywords = ["mcp", "model-context-protocol", "security", "authorization", "rbac", "conformance", "attestation", "agents", "owasp"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
# The test suite runs on the standard library alone: it starts real MCP
# servers as subprocesses and asserts on what the harness finds.
dev = []

[project.urls]
Homepage = "https://balanov.pro/mcp-attest/"
Documentation = "https://balanov.pro/mcp-attest/"
Source = "https://github.com/Balanov/mcp-attest"
Issues = "https://github.com/Balanov/mcp-attest/issues"
Changelog = "https://github.com/Balanov/mcp-attest/blob/main/CHANGELOG.md"

[project.scripts]
attest = "mcp_attest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
