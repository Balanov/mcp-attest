name: "mcp-attest"
description: "Fail the build when an MCP server does not enforce the access control you wrote."
author: "Balanov.PRO"

inputs:
  mode:
    description: "test = live conformance against a server; check = audit a recorded trace; suite = run a portable suite"
    required: false
    default: "test"
  policy:
    description: "Path to the policy JSON file"
    required: true
    default: ".attest/policy.json"
  command:
    description: "Command that starts the MCP server over stdio (mode: test)"
    required: false
    default: ""
  url:
    description: "URL of an MCP server speaking Streamable HTTP (mode: test)"
    required: false
    default: ""
  trace:
    description: "Path to the newline-delimited JSON trace (mode: check)"
    required: false
    default: ".attest/trace.jsonl"
  otlp:
    description: "Path to an OpenTelemetry export to check instead of a trace file (mode: check)"
    required: false
    default: ""
  suite:
    description: "Path to a portable suite file (mode: suite)"
    required: false
    default: ".attest/suite.json"
  baseline:
    description: "Approved tool manifest to compare against (mode: test)"
    required: false
    default: ""
  strict:
    description: "Treat medium findings as failures too"
    required: false
    default: "false"
  sarif:
    description: "Write SARIF 2.1.0 to this path so code scanning picks the findings up"
    required: false
    default: ""
  evidence:
    description: "Write the signed evidence bundle to this path"
    required: false
    default: ""
  key-env:
    description: "Name of the environment variable holding the HMAC key for the evidence bundle"
    required: false
    default: "MCP_ATTEST_KEY"

runs:
  using: "composite"
  steps:
    - name: Install mcp-attest
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install mcp-attest

    - name: Test the server against the policy
      if: inputs.mode == 'test'
      shell: bash
      run: |
        args=(test --policy "${{ inputs.policy }}")
        if [ -n "${{ inputs.command }}" ]; then args+=(--command "${{ inputs.command }}"); fi
        if [ -n "${{ inputs.url }}" ]; then args+=(--url "${{ inputs.url }}"); fi
        if [ -n "${{ inputs.baseline }}" ]; then args+=(--baseline "${{ inputs.baseline }}"); fi
        if [ -n "${{ inputs.sarif }}" ]; then args+=(--sarif "${{ inputs.sarif }}"); fi
        if [ -n "${{ inputs.evidence }}" ]; then args+=(--evidence "${{ inputs.evidence }}" --key-env "${{ inputs.key-env }}"); fi
        if [ "${{ inputs.strict }}" = "true" ]; then args+=(--strict); fi
        attest "${args[@]}"

    - name: Check the trace against the policy
      if: inputs.mode == 'check'
      shell: bash
      run: |
        args=(check --policy "${{ inputs.policy }}" --json)
        if [ -n "${{ inputs.otlp }}" ]; then args+=(--otlp "${{ inputs.otlp }}"); else args+=(--trace "${{ inputs.trace }}"); fi
        if [ "${{ inputs.strict }}" = "true" ]; then args+=(--strict); fi
        attest "${args[@]}"

    - name: Run the suite
      if: inputs.mode == 'suite'
      shell: bash
      run: |
        args=(suite run --suite "${{ inputs.suite }}")
        if [ -n "${{ inputs.command }}" ]; then args+=(--command "${{ inputs.command }}"); fi
        if [ -n "${{ inputs.url }}" ]; then args+=(--url "${{ inputs.url }}"); fi
        if [ -n "${{ inputs.sarif }}" ]; then args+=(--sarif "${{ inputs.sarif }}"); fi
        if [ "${{ inputs.strict }}" = "true" ]; then args+=(--strict); fi
        attest "${args[@]}"

    - name: Upload SARIF findings
      if: (inputs.mode == 'test' || inputs.mode == 'suite') && inputs.sarif != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif }}
        category: mcp-attest
